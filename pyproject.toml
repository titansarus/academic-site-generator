[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acadsite"
version = "0.1.0"
description = "A reusable Python static site generator with generic collections, pages, and components, plus an academic preset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirmahdi Namjoo", email = "amirm137878@gmail.com" }]
keywords = ["static-site-generator", "academic", "jinja2", "markdown", "github-pages"]
dependencies = [
    "Jinja2>=3.1",
    "Markdown>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
acadsite = "acadsite.cli:main"

[tool.setuptools.packages.find]
include = ["acadsite*"]

[tool.setuptools.package-data]
acadsite = [
    "templates/**/*.j2",
    "templates/**/*.html",
    "static/**/*",
    "presets/**/*.json",
    "presets/**/*.j2",
    "presets/**/*.css",
    "presets/**/*.js",
    "presets/**/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
